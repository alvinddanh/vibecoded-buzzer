<script>
    const socket = io();
    let currentUser = null;
    let currentGameState = null;
    let localTimerInterval = null;
    let currentRenderedOptions = ""; 

    // XỬ LÝ ĐĂNG NHẬP
    function login() {
        const name = document.getElementById('username').value.trim();
        if (!name) return alert('Vui lòng nhập tên của bạn!');
        socket.emit('login', name);
    }

    socket.on('login_success', (userData) => {
        currentUser = userData;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        document.getElementById('user-name').innerText = currentUser.name;
        
        if (currentUser.role === 'admin') {
            document.getElementById('user-role').innerText = 'QUẢN TRÒ';
            document.getElementById('user-role').classList.replace('text-gray-500', 'text-red-600');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('player-panel').classList.add('hidden');
        } else {
            document.getElementById('user-role').innerText = 'THÍ SINH';
            document.getElementById('player-panel').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
        }
    });

    // NHẬN TRẠNG THÁI TỪ SERVER VÀ ĐỒNG BỘ THỜI GIAN
    socket.on('state_update', (state) => {
        currentGameState = state;
        
        // TÍNH ĐỘ LỆCH THỜI GIAN GIỮA SERVER VÀ CLIENT
        const timeOffset = state.serverTime ? (state.serverTime - Date.now()) : 0; 
        
        const statusEl = document.getElementById('status-display');
        const timerEl = document.getElementById('timer-display');
        
        clearInterval(localTimerInterval);
        
        if (state.isLocked) {
            statusEl.innerText = 'TRẠNG THÁI: ĐÃ KHÓA';
            statusEl.className = 'text-sm font-semibold text-red-600 mt-1';
            timerEl.innerText = '0.00';
        } else {
            statusEl.innerText = 'TRẠNG THÁI: ĐANG MỞ (BUZZ!)';
            statusEl.className = 'text-sm font-semibold text-green-600 mt-1';
            
            if (state.endTime) {
                localTimerInterval = setInterval(() => {
                    // Dùng giờ đã bù trừ độ lệch
                    let adjustedNow = Date.now() + timeOffset; 
                    let remain = (state.endTime - adjustedNow) / 1000;
                    if (remain <= 0) { remain = 0; clearInterval(localTimerInterval); }
                    timerEl.innerText = remain.toFixed(2);
                }, 30);
            } else if (state.unlockedAt) {
                localTimerInterval = setInterval(() => {
                    let adjustedNow = Date.now() + timeOffset;
                    let elapsed = (adjustedNow - state.unlockedAt) / 1000;
                    timerEl.innerText = elapsed.toFixed(2);
                }, 30);
            }
        }

        // XỬ LÝ GIAO DIỆN QUẢN TRÒ
        if (currentUser && currentUser.role === 'admin') {
            document.getElementById('mode-select').value = state.mode;
            document.getElementById('allowed-options-input').value = state.allowedOptions;
            
            if (state.mode === 'multiple_choice') {
                document.getElementById('dynamic-keys-setting').classList.remove('hidden');
            } else {
                document.getElementById('dynamic-keys-setting').classList.add('hidden');
            }
            renderAdminQueue(state.queue);
        }

        // XỬ LÝ GIAO DIỆN NGƯỜI CHƠI
        if (currentUser && currentUser.role === 'player') {
            const btn = document.getElementById('buzz-btn');
            const answerContainer = document.getElementById('answer-container');
            const mcContainer = document.getElementById('mc-container');
            const answerInput = document.getElementById('player-answer');

            if (state.mode === 'answer_and_buzzer') {
                answerContainer.classList.remove('hidden');
                mcContainer.classList.add('hidden');
            } else if (state.mode === 'multiple_choice') {
                mcContainer.classList.remove('hidden');
                answerContainer.classList.add('hidden');
                
                if (state.allowedOptions !== currentRenderedOptions) {
                    renderDynamicKeyboard(state.allowedOptions);
                    currentRenderedOptions = state.allowedOptions;
                    document.getElementById('mc-display').value = ''; 
                }
            } else {
                answerContainer.classList.add('hidden');
                mcContainer.classList.add('hidden');
            }

            const hasBuzzed = state.queue.find(p => p.name === currentUser.name);

            if (state.isLocked) {
                btn.disabled = true;
                btn.className = "w-64 h-64 rounded-full bg-gray-400 text-white text-4xl font-black shadow-[0_10px_0_rgb(107,114,128)] cursor-not-allowed transition-all";
                btn.innerText = hasBuzzed ? "ĐÃ LƯU" : "KHÓA";
                answerInput.disabled = true;
            } else {
                if (hasBuzzed) {
                    btn.disabled = true;
                    btn.className = "w-64 h-64 rounded-full bg-blue-500 text-white text-4xl font-black shadow-[0_10px_0_rgb(59,130,246)] cursor-not-allowed transition-all";
                    btn.innerText = hasBuzzed.time + "s";
                    answerInput.disabled = true;
                } else {
                    btn.disabled = false;
                    btn.className = "w-64 h-64 rounded-full bg-red-600 text-white text-4xl font-black shadow-[0_10px_0_rgb(185,28,28)] active:shadow-[0_0px_0_rgb(185,28,28)] active:translate-y-[10px] cursor-pointer transition-all hover:bg-red-500";
                    btn.innerText = "BUZZ!";
                    answerInput.disabled = false;
                    if (state.mode === 'answer_and_buzzer' && document.activeElement !== answerInput) {
                        answerInput.focus();
                    }
                }
            }
            renderPlayerQueue(state.queue);
        }
    });

    // CÁC HÀM CÒN LẠI GIỮ NGUYÊN (Không thay đổi)
    function renderDynamicKeyboard(optionsString) {
        const keyboard = document.getElementById('dynamic-keyboard');
        keyboard.innerHTML = ''; 
        const cleanOptions = optionsString.replace(/\s+/g, '').toUpperCase();
        for (let i = 0; i < cleanOptions.length; i++) {
            const char = cleanOptions[i];
            const btn = document.createElement('button');
            btn.className = "bg-white hover:bg-gray-100 border-b-4 border-gray-300 text-gray-800 font-bold px-5 py-3 min-w-[3.5rem] rounded-xl text-2xl active:border-b-0 active:translate-y-1 transition-all shadow-sm flex items-center justify-center";
            btn.innerText = char;
            btn.onclick = () => appendMC(char);
            keyboard.appendChild(btn);
        }
    }

    function changeMode() { 
        const mode = document.getElementById('mode-select').value;
        const options = getCleanAdminOptions();
        socket.emit('admin_action', { action: 'change_mode', mode: mode, allowedOptions: options }); 
    }
    
    function updateOptions() {
        const options = getCleanAdminOptions();
        if (!options) return alert('Vui lòng nhập ít nhất 1 phương án!');
        socket.emit('admin_action', { action: 'update_options', allowedOptions: options });
    }

    function getCleanAdminOptions() {
        const raw = document.getElementById('allowed-options-input').value.toUpperCase().replace(/\s+/g, '');
        const clean = Array.from(new Set(raw.split(''))).join('');
        document.getElementById('allowed-options-input').value = clean;
        return clean || 'ABCD';
    }

    function toggleLock(isLocked) { socket.emit('admin_action', { action: 'toggle_lock', isLocked }); }
    function clearQueue() { 
        socket.emit('admin_action', { action: 'clear_queue' }); 
        document.getElementById('admin-text-box').value = '';
    }
    function startTimer() {
        const seconds = parseFloat(document.getElementById('timer-input').value);
        if (!seconds || seconds <= 0) return alert('Vui lòng nhập số giây hợp lệ');
        socket.emit('admin_action', { action: 'start_timer', seconds });
    }

    function copyTextBox(btn) {
        const textBox = document.getElementById('admin-text-box');
        if (!textBox.value.trim()) return;
        navigator.clipboard.writeText(textBox.value).then(() => {
            const originalText = btn.innerText;
            btn.innerText = 'Đã Copy!';
            btn.classList.replace('bg-black', 'bg-green-600');
            btn.classList.replace('hover:bg-gray-800', 'hover:bg-green-700');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-green-600', 'bg-black');
                btn.classList.replace('hover:bg-green-700', 'hover:bg-gray-800');
            }, 2000);
        });
    }

    function handleEnter(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); 
            document.getElementById('player-answer').blur(); 
            sendBuzz(); 
        }
    }

    function appendMC(letter) {
        if (currentGameState && currentGameState.isLocked) return;
        const display = document.getElementById('mc-display');
        if (!display.value.includes(letter)) {
            display.value += letter;
        }
    }

    function clearMC() {
        if (currentGameState && currentGameState.isLocked) return;
        document.getElementById('mc-display').value = '';
    }

    function sendBuzz() {
        if (currentGameState.isLocked) return;
        const payload = { name: currentUser.name, answer: '' };
        
        if (currentGameState.mode === 'answer_and_buzzer') {
            const answer = document.getElementById('player-answer').value.trim();
            if (!answer) return alert('Vui lòng nhập đáp án trước khi bấm chuông!');
            payload.answer = answer;
        } else if (currentGameState.mode === 'multiple_choice') {
            const answer = document.getElementById('mc-display').value;
            if (!answer) return alert('Vui lòng chọn ít nhất một phương án trước khi bấm chuông!');
            payload.answer = answer;
        }
        
        socket.emit('buzz', payload);
    }

    function renderAdminQueue(queue) {
        const ul = document.getElementById('admin-queue');
        const textBox = document.getElementById('admin-text-box');
        ul.innerHTML = '';
        
        if(queue.length === 0) {
            ul.innerHTML = '<li class="text-gray-500 italic">Chưa có ai bấm chuông.</li>';
            return;
        }
        
        let textData = [];
        queue.forEach((q, index) => {
            const li = document.createElement('li');
            li.className = "p-3 bg-gray-50 rounded border-l-4 border-blue-500 flex flex-col";
            li.innerHTML = `
                <div class="flex justify-between font-bold text-lg">
                    <span>#${index + 1} - ${q.name}</span>
                    <span class="text-green-600">${q.time}s</span>
                </div>
                ${q.answer ? `<div class="text-red-600 font-bold mt-1 text-xl tracking-wider">Đáp án: ${q.answer}</div>` : ''}
            `;
            ul.appendChild(li);

            if (currentGameState.mode !== 'buzzer_only' || q.answer !== "") {
                textData.push(`${q.name}, ${q.answer}, ${q.time}`);
            } else {
                textData.push(`${q.name}, ${q.time}`);
            }
        });

        textBox.value = textData.join('\n');
    }

    function renderPlayerQueue(queue) {
        const ul = document.getElementById('player-queue');
        ul.innerHTML = '';
        queue.forEach((q, index) => {
            const li = document.createElement('li');
            li.className = "text-gray-700 p-2 bg-gray-50 rounded border mb-1 flex justify-between";
            li.innerHTML = `<span><strong>#${index + 1}</strong>: ${q.name}</span> <span>${q.time}s</span>`;
            ul.appendChild(li);
        });
    }
</script>
